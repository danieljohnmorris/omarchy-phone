# ~/.config/chromium-flags.conf on the phone.
#
# Omarchy's flags verbatim, except the password store. Upstream uses
# gnome-libsecret, which makes Chromium's first launch pop gcr-prompter's
# "Choose password for new keyring" dialog: two password fields that must be
# typed and then re-typed identically, and the keyring has to be unlocked
# again on every login. There is no physical keyboard here, the dialog is a
# 540x324 floating surface that the on-screen keyboard covers, and nothing
# answers it, so the browser is unusable until it is dismissed.
#
# "basic" keeps saved passwords in Chromium's own obfuscated store instead.
# That is weaker at rest than a locked keyring, which is the right trade for a
# device whose whole disk is unencrypted and whose ssh account password is in
# config.env anyway. Passwords typed into web pages still work; only the
# at-rest encryption of *saved* ones changes.
#
# The user agent is the phone's, not X11/Linux. Chromium reports the panel
# honestly (screen.width 540, viewport 480 CSS px, <meta viewport> honoured),
# but a default UA of "X11; Linux x86_64" makes sites serve their desktop
# layout into it: Wikipedia's Vector skin wants ~1000px and ran off the right
# edge. With this string the same page renders in the mobile skin.
#
# Caveat: this changes the UA *string* only. Chromium has no flag to override
# User-Agent Client Hints, so navigator.userAgentData.mobile stays false and
# sites that sniff UA-CH instead (mostly Google's own) still serve desktop.
#
# Not a scale fix. Web content is cut off on the right whenever GTK's
# text-scaling-factor is not 1.0, in any page, including local files with no
# overflow at all: Chromium sizes its Wayland buffer as logical x text-scale
# and Hyprland crops the excess. --force-device-scale-factor does not help
# (it moves devicePixelRatio, not the widget scale). See the README.
--ozone-platform=wayland
--ozone-platform-hint=wayland
--password-store=basic
--enable-features=TouchpadOverscrollHistoryNavigation
# The quotes are required: the launcher splits this file on whitespace, so an
# unquoted UA arrives as a dozen separate arguments and Chromium opens the
# fragments as URLs instead (the window title comes up as "(linux;").
--user-agent="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36"
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
