# fajita (OnePlus 6T) initramfs. Busybox hooks (not systemd): built in a
# chroot under a different host kernel, and the OnePlus bootloader injects
# "root=/dev/dm-0 dm=..." into the cmdline, so the fajitaroot hook forces the
# real root device. UFS, panel, DRM, USB gadget and ext4 are all builtin in
# the pmOS sdm845 kernel, so MODULES is minimal.
MODULES=(ext4)
BINARIES=()
HOOKS=(base udev modconf block fajitaroot filesystems fsck ensuresshd)
COMPRESSION="gzip"
# GPU probes before the rootfs is mounted; adreno needs its firmware from the initramfs
FILES=(/usr/lib/firmware/qcom/a630_sqe.fw /usr/lib/firmware/qcom/a630_gmu.bin /usr/lib/firmware/qcom/sdm845/oneplus6/a630_zap.mbn)
